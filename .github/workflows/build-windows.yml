name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pillow tkcalendar openpyxl pyinstaller

    - name: Build EXE with PyInstaller
      shell: cmd
      run: pyinstaller --onefile --windowed --add-data "real;real" --add-data "fonts;fonts" --add-data "Logo.png;." --add-data "logoicon.ico;." --add-data "font_loader.py;." --icon logoicon.ico mkpos.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: mk-pos-windows
        path: dist/mkpos.exe
        retention-days: 30